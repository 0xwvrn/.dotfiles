# MPV Modern & Minimal Configuration with uosc
osc=no
osd-bar=no
border=no

hwdec=auto-safe
vo=gpu-next
gpu-context=wayland

keep-open=yes
autofit-larger=85%x85%
cursor-autohide=1000
cursor-autohide-fs-only=no

# Subtitles styling
sub-font="Inter"
sub-font-size=38
sub-color="#f1ede9"
sub-border-color="#121212"
sub-border-size=1.5
sub-shadow-offset=0
sub-auto=fuzzy

# Screenshots
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~/Pictures/Photos
screenshot-template="mpv-shot%04n"
