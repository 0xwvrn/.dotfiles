# uosc configuration - Modern, minimalist UI
border_radius=0
timeline_style=bar
timeline_line_width=3
timeline_size=12
timeline_border=1
timeline_cache=yes
timeline_persistency=paused

progress=always
progress_size=3
progress_line_width=20

controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,gap,space,prev,play-pause,next,space,gap,fullscreen
controls_size=24
controls_margin=8
controls_spacing=4
controls_persistency=paused

volume=right
volume_size=40
volume_border=1
volume_step=1
speed_step=0.1

top_bar=no-border
top_bar_size=38
top_bar_title=yes
top_bar_persistency=paused

menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

font_scale=0.7
scale=1.1
scale_fullscreen=1.3
animation_duration=120
proximity_in=50
proximity_out=140

color=foreground=AB9A86,foreground_text=121212,background=121212,background_text=f1ede9,window_border=121212,curtain=121212,match=AB9A86
