# ~/.config/tmux/tmux.conf

# 24-bit Truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Plugins
set -g @plugin 'tmux-plugins/tpm' # mandatory
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

# Note: static themes like tmux-gruvbox are overridden below by dynamic pywal colors
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark'

run '~/.tmux/plugins/tpm/tpm'

# Dynamic Pywal theme (sourced after TPM to ensure wallpaper colors take effect)
if-shell "[ -f ~/.cache/wal/colors-tmux.conf ]" "source-file ~/.cache/wal/colors-tmux.conf"

# Neovim-style Vi navigation and pane management
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
