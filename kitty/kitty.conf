include ~/.cache/wal/colors-kitty.conf

window_border_width 0

detect_urls yes
url_color #0087bd
url_style curly

 
window_padding_width 4

# BEGIN_KITTY_FONTS
font_family      family=Hack postscript_name=Hack-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Environment for TUI themes and local binaries
env PATH=${HOME}/.local/bin:${PATH}
env NEWT_COLORS=root=white,black:border=lightgray,black:window=white,black:shadow=black,black:title=brightcyan,black:button=white,black:actbutton=black,brightcyan:compactbutton=white,black:checkbox=white,black:actcheckbox=black,brightcyan:entry=brightwhite,gray:label=white,black:listbox=white,black:actlistbox=white,black:sellistbox=white,gray:actsellistbox=black,brightcyan:textbox=white,black:acttextbox=black,brightcyan:helpline=lightgray,black:roottext=lightgray,black:emptyscale=gray,black:fullscale=brightcyan,black:disentry=gray,black

# Neovim-style terminal scrolling & scrollback inspection
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down
map ctrl+shift+g scroll_end
scrollback_pager nvim -c 'set ft=man nonumber nolist' -
map ctrl+shift+h show_scrollback
